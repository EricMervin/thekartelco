
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheKartel Co - Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Playfair Display', serif;
            background-color: #F5E6D8;
            color: #8B1E1E;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .content {
            text-align: center;
        }

        .brand {
            font-size: 5rem;
            font-weight: 500;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .coming-soon {
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .email {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1rem;
            color: #8B1E1E;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .email:hover {
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .brand {
                font-size: 3rem;
            }

            .coming-soon {
                font-size: 1.5rem;
            }

            .email {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <h1 class="brand">TheKartel Co</h1>
        <p class="coming-soon">Coming Soon</p>
    </div>
    
    <a href="mailto:info@thekartel.co" class="email">info@thekartel.co</a>
</body>
</html>
