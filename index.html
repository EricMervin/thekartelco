<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Kartel Co - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f4efe8;
            color: #0b1726;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .content {
            text-align: center;
        }

        .logo-img {
            max-width: 600px;
            width: 100%;
            height: auto;
            margin-bottom: 40px;
        }

        .coming-soon {
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .email {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1rem;
            color: #0b1726;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .email:hover {
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .logo-img {
                max-width: 90%;
            }

            .coming-soon {
                font-size: 1.5rem;
            }

            .email {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <img src="assets/logo.png" alt="TheKartel Co" class="logo-img">
        <p class="coming-soon">Coming Soon</p>
    </div>
    
    <a href="mailto:info@thekartel.co" class="email">info@thekartel.co</a>
</body>
</html>
